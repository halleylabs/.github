name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you see, and what did you expect to see?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: e.g. 0.3.1 or commit sha
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS, runtime version, model provider
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
